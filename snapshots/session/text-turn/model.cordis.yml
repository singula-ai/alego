# The recorded request header selects the replay route. This keeps model
# selection in session JSONL instead of duplicating it across manifests.

- id: agent-default-model
  name: '@singula-ai/alego-agent-default-model'
  config:
    provider: !!js process.env.ALEGO_SNAPSHOT_PROVIDER
    model: !!js process.env.ALEGO_SNAPSHOT_MODEL
