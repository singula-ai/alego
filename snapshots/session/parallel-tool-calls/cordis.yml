# Filesystem-scenario overlay: the sandboxed filesystem stack already lives in
# `alego-base`, so this patch changes only the local tool-result spill
# storage those scenarios exercise.

- id: spill-local
  name: '@singula-ai/alego-spill-local'
  config:
    root: !!js process.env.ALEGO_SNAPSHOT_SPILL_ROOT ?? './.spill'

- id: spill-policy
  name: '@singula-ai/alego-spill-policy'
  config:
    maxInlineBytes: !!js process.env.ALEGO_SNAPSHOT && 800 || 50000
