- id: llm-deepseek
  disabled: true

- insert:
    - id: llm-replay
      name: '@singula-ai/alego-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 8192
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: high

- insert:
    - id: skill-office
      name: '@singula-ai/alego-skill-office'
      disabled: false
      config:
        assetRoot: !!js process.cwd() + '/office-skills'
        node: !!js process.cwd() + '/office-node'
        cli: !!js process.cwd() + '/render-cli.cjs'

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true
