# Session-root sandbox snapshot overlay. The generated session cwd lives
# under the user's home, while this deployment fallback deliberately points at
# /tmp. A workspace-write mutation can therefore succeed only when the calling
# session's cwd replaces the process-level fallback root.
- id: sandbox-policy
  name: '@singula-ai/alego-sandbox-policy'
  config:
    mode: !!js "process.env.ALEGO_PERMISSION_MODE ?? (process.env.ALEGO_SNAPSHOT === undefined ? 'workspace-write' : 'danger-full-access')"
    workspaceRoot: /tmp
