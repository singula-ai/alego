# Keyless replay for the read-image refusal scenario: identical to the
# image.cordis.snapshot.yml overlay except the replay catalog leaves flash
# text-only, so the strict read_image gate refuses and no image ever enters
# the durable log.
- id: llm-deepseek
  name: '@singula-ai/alego-llm-deepseek'
  disabled: true

- id: agent-default-model
  name: '@singula-ai/alego-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@singula-ai/alego-session-persistence-jsonl'
  config:
    root: !!js alegoHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@singula-ai/alego-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@singula-ai/alego-system-prompt'
  config:
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@singula-ai/alego-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                inputModalities: [text]
              - id: deepseek-v4-pro
                inputModalities: [text]

- id: attachment-local
  name: '@singula-ai/alego-attachment-local'
