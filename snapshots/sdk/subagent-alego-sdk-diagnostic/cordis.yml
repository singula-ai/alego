# TypeScript SDK snapshot patch for automatic ALEGO SDK failure notices.

- id: skill-filesystem
  name: '@singula-ai/alego-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@singula-ai/alego-llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@singula-ai/alego-session-persistence-jsonl'
  config:
    root: !!js alegoHomePath('sessions')
    compression: !!js "process.env.ALEGO_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-log-deepseek
  name: '@singula-ai/alego-session-log-deepseek'
  config:
    enabled: true

- insert:
    - id: subagent-alego-sdk-diagnostic
      name: '@singula-ai/alego-subagent-alego-sdk'
      config:
        providerName: alego-sdk-diagnostic
        profile: sdk
        patches:
          - !!js process.env.ALEGO_TEST_CHILD_PATCH
        alegoHome: !!js alegoHomePath('children/first')
        provider: mock
        model: mock-echo
        env:
          ALEGO_TELEMETRY_DISABLED: '1'
          ALEGO_TEST_CHILD_FAILURE: '1'
    - id: tool-subagent-alego-sdk-diagnostic
      name: '@singula-ai/alego-tool-subagent'
      config:
        provider: alego-sdk-diagnostic
        toolName: subagent_alego_sdk
        maxDepth: provider-managed
    - id: subagent-alego-sdk-diagnostic-second
      name: '@singula-ai/alego-subagent-alego-sdk'
      config:
        providerName: alego-sdk-diagnostic-second
        profile: sdk
        patches:
          - !!js process.env.ALEGO_TEST_CHILD_PATCH
        alegoHome: !!js alegoHomePath('children/second')
        provider: mock
        model: mock-echo
        env:
          ALEGO_TELEMETRY_DISABLED: '1'
          ALEGO_TEST_CHILD_FAILURE: '1'
    - id: tool-subagent-alego-sdk-diagnostic-second
      name: '@singula-ai/alego-tool-subagent'
      config:
        provider: alego-sdk-diagnostic-second
        toolName: subagent_alego_sdk_second
        maxDepth: provider-managed
    - id: await-external-subagents
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/subagent-settlement-barrier.ts'
