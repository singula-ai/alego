# Keyless replay layer for the ordinary SDK snapshot composition.

- id: llm-deepseek
  name: '@singula-ai/alego-llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@singula-ai/alego-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
