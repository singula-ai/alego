# Named Codex providers and tools over the shipped headless profile.
# No model or product process starts in this test.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- insert:
    - id: fixture
      name: './fixture.ts'

    - id: subagent-codex
      name: '@singula-ai/alego-subagent-codex'

    - id: subagent-codex-primary
      name: '@singula-ai/alego-subagent-codex'
      config:
        providerName: codex-primary
        model: codex-primary-model

    - id: subagent-codex-secondary
      name: '@singula-ai/alego-subagent-codex'
      config:
        providerName: codex-secondary
        model: codex-secondary-model

    - id: tool-subagent-codex
      name: '@singula-ai/alego-tool-subagent'
      config:
        provider: codex
        toolName: subagent_codex
        maxDepth: 'provider-managed'

    - id: tool-subagent-codex-primary
      name: '@singula-ai/alego-tool-subagent'
      config:
        provider: codex-primary
        toolName: subagent_codex_primary
        maxDepth: 'provider-managed'

    - id: tool-subagent-codex-secondary
      name: '@singula-ai/alego-tool-subagent'
      config:
        provider: codex-secondary
        toolName: subagent_codex_secondary
        maxDepth: 'provider-managed'
