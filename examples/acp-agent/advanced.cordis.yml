# Add Code Mode and Cordis tools to the base spawn/workflow stack, exercising
# all four boundaries in one ACP snapshot.
- id: base
  name: '@singula-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: acp-agent
        name: '@singula-ai/alego-acp-demo'
        config:
          provider: deepseek-official
          model: deepseek-v4-pro
          persistenceRoot: !!js process.env.ALEGO_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: !!js "process.env.ALEGO_SNAPSHOT === undefined ? 'zstd' : 'none'"
          workspaceContext:
            maxBytes: 65536
          tools:
            mode: both
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: code-runtime
            name: '@singula-ai/alego-code-runtime-worker-thread'
          - id: cordis-host-runner
            name: '@singula-ai/alego-cordis-host-runner'
          - id: tool-cordis
            name: '@singula-ai/alego-tool-cordis'
