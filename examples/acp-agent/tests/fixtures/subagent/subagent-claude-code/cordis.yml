# Test-only composition of Codex, the Bundle-supplied default Claude provider,
# and two named Claude instances. It never invokes a model or product process.
- id: fixture
  name: './fixture.ts'

- id: subagent
  name: '@singula-ai/alego-subagent'

- id: subprocess
  name: '@singula-ai/alego-subprocess-local'

- id: subagent-codex
  name: '@singula-ai/alego-subagent-codex'

- id: subagent-claude-primary
  name: '@singula-ai/alego-subagent-claude-code'
  config:
    providerName: claude-primary

- id: subagent-claude-secondary
  name: '@singula-ai/alego-subagent-claude-code'
  config:
    providerName: claude-secondary

- id: tool-subagent-codex
  name: '@singula-ai/alego-tool-subagent'
  config:
    provider: codex
    toolName: subagent_codex
    backgroundMode: one-shot
    maxDepth: 'provider-managed'

- id: tool-subagent-claude-code
  name: '@singula-ai/alego-tool-subagent'
  config:
    provider: claude-code
    toolName: subagent_claude_code
    backgroundMode: one-shot
    maxDepth: 'provider-managed'

- id: tool-subagent-claude-primary
  name: '@singula-ai/alego-tool-subagent'
  config:
    provider: claude-primary
    toolName: subagent_claude_primary
    backgroundMode: one-shot
    maxDepth: 'provider-managed'

- id: tool-subagent-claude-secondary
  name: '@singula-ai/alego-tool-subagent'
  config:
    provider: claude-secondary
    toolName: subagent_claude_secondary
    backgroundMode: one-shot
    maxDepth: 'provider-managed'

- id: agent-spine
  name: '@singula-ai/alego-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: mock
        model: mock-delegate
        cwd: !!js process.cwd()
    persona: 'This composition test must not start a model turn.'
    workspaceContext: false

- id: persistence
  name: '@singula-ai/alego-session-persistence-jsonl'
  config:
    root: './.sessions'

- id: checkpoint-policy
  name: '@singula-ai/alego-session-checkpoint-policy'
