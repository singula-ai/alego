# The smallest composition that can carry a plugin: a tool registry, the
# system-prompt assembler the registry publishes its schema through, and one
# locally authored plugin mounted by relative path — the same entry form a
# published plugin uses, with a package name in place of the path.
- id: system-prompt
  name: '@alego/system-prompt'

- id: tools
  name: '@alego/tools'

# `config` is validated by the plugin's own Schemastery `Config`; an invalid
# value fails the load rather than reaching the tool.
- id: hello-world
  name: './src/hello-world.ts'
  config:
    greeting: Hello
